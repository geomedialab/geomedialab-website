backend:
  name: github
  repo: geomedialab/geomedialab-website
  branch: 11ty-site

media_folder: /src/imgs
public_folder: /imgs
site_url: https://geomedialab.org
locale: en

# ─────────────────────────────────────────────────────────────
# i18n: Sveltia CMS creates paired files per locale.
# With omit_default_locale_from_file_path, EN files have no
# suffix (.md) and FR files get .fr.md — matching the existing
# eleventyComputed.js filename-based language detection.
# initial_locales: default → new entries start EN-only; FR is
# enabled per entry from the editor's locale menu.
# ─────────────────────────────────────────────────────────────
i18n:
  structure: multiple_files
  locales: [en, fr]
  default_locale: en
  omit_default_locale_from_file_path: true
  initial_locales: default

# Every folder collection uses `path: "{{slug}}/{{slug}}"` (one subfolder per
# entry, which the 11ty side relies on), and therefore needs collection-level
# absolute media paths — otherwise Sveltia saves uploads inside the entry folder,
# where they are never published.

collections:

  # ─────────────────────────────────────────────────────────────
  - name: projects
    label: "Projects"
    label_singular: "Project"
    description: "Project pages. Each one appears as a card in the horizontal gallery on the home page."
    folder: src/content/projects
    create: true
    path: "{{slug}}/{{slug}}"
    media_folder: "/src/imgs"
    public_folder: "/imgs"
    extension: md
    format: frontmatter
    i18n: true
    sortable_fields: [order, title]
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - { label: "Years", name: years, widget: string, required: false, hint: "Shown under the gallery card, e.g. 2014-2021", i18n: true }
      - { label: "Cover image", name: img, widget: image, required: false, hint: "Gallery card image", i18n: duplicate }
      - { label: "Cover focus", name: focus, widget: string, required: false, default: "50% 50%", hint: "Which part of the cover stays visible when cropped: horizontal then vertical. 50% 0% = top centre, 0% 50% = left", i18n: duplicate }
      - { label: "Gallery position", name: order, widget: number, value_type: int, required: false, hint: "Lower numbers come first in the gallery (existing projects use 10, 20, 30…)", i18n: duplicate }
      - { label: "Show in gallery", name: gallery, widget: boolean, default: true, required: false, i18n: duplicate }
      - { label: "External link (optional)", name: redirect, widget: string, required: false, hint: "If set, the gallery card links here instead of to this page", i18n: duplicate }
      - { label: "Description (link preview)", name: description, widget: text, required: false, i18n: true }
      - { label: "Content", name: body, widget: markdown, required: false, i18n: true }

  # ─────────────────────────────────────────────────────────────
  - name: posts
    label: "News"
    label_singular: "News item"
    description: "News items, newest first in the column under the project gallery. Can be just an image with a title, or a full text post."
    folder: src/content/posts
    create: true
    path: "{{slug}}/{{slug}}"
    media_folder: "/src/imgs"
    public_folder: "/imgs"
    extension: md
    format: frontmatter
    i18n: true
    sortable_fields: [date, title]
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate }
      - { label: "Image (optional)", name: img, widget: image, required: false, i18n: duplicate }
      - { label: "Image description (for screen readers)", name: alt, widget: string, required: false, i18n: true }
      - { label: "Description (link preview)", name: description, widget: text, required: false, i18n: true }
      - { label: "Text (optional)", name: body, widget: markdown, required: false, i18n: true }

  # ─────────────────────────────────────────────────────────────
  - name: people
    label: "Team"
    label_singular: "Team member"
    description: "People shown on the Team page."
    folder: src/content/people
    create: true
    path: "{{slug}}/{{slug}}"
    media_folder: "/src/imgs/people"
    public_folder: "/imgs/people"
    extension: md
    format: frontmatter
    i18n: true
    sortable_fields: [order, title, status]
    fields:
      - { label: "Name", name: title, widget: string, i18n: duplicate }
      - { label: "Photo", name: photo, widget: image, required: false, i18n: duplicate }
      - { label: "Role", name: role, widget: string, required: false, hint: "e.g. PhD candidate, Director", i18n: true }
      - { label: "Status", name: status, widget: select, options: [current, alumni], default: current, i18n: duplicate }
      - { label: "Position", name: order, widget: number, value_type: int, required: false, hint: "Lower numbers come first", i18n: duplicate }
      - { label: "Personal page (optional)", name: link, widget: string, required: false, i18n: duplicate }
      - { label: "Bio", name: body, widget: markdown, required: false, i18n: true }

  # ─────────────────────────────────────────────────────────────
  - name: pages
    label: "Pages"
    label_singular: "Page"
    folder: src/content/pages
    create: true
    path: "{{slug}}/{{slug}}"
    media_folder: "/src/imgs"
    public_folder: "/imgs"
    extension: md
    format: frontmatter
    i18n: true
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - label: "Layout"
        name: layout
        widget: select
        options:
          - { label: "Standard page", value: basic.html }
          - { label: "Team (lists team members)", value: team.html }
          - { label: "Contact (with map)", value: contact.html }
          - { label: "News (lists all news)", value: posts-overview.html }
        default: basic.html
        i18n: duplicate
      - { label: "Menus", name: tags, widget: select, multiple: true, required: false, options: [{ label: "Top menu", value: nav-items }, { label: "Footer", value: index-pages }], i18n: duplicate }
      - { label: "Menu position", name: order, widget: number, value_type: int, required: false, hint: "Lower numbers come first", i18n: duplicate }
      - { label: "External link (optional)", name: redirect, widget: string, required: false, hint: "If set, menu links point here instead of to this page", i18n: duplicate }
      - { label: "Description (link preview)", name: description, widget: text, required: false, i18n: true }
      - { label: "Content", name: body, widget: markdown, required: false, i18n: true }

  # ─────────────────────────────────────────────────────────────
  - name: home
    label: "Home page"
    i18n: true
    files:
      - name: landing
        label: "Home page text (About, Partnerships, Land acknowledgement)"
        file: src/content/index.md
        i18n: true
        fields:
          - { label: "Layout", name: layout, widget: hidden, default: landing.html, i18n: duplicate }
          - { label: "Title", name: title, widget: hidden, default: Home, i18n: true }
          - { label: "Text", name: body, widget: markdown, hint: "Shown beside the news column, under the project gallery", i18n: true }
