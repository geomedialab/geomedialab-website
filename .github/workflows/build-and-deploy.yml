name: Build 11ty

on:
  push:
    branches: ['11ty-site']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Run npm build
        run: npm run build:prod

      # Publishes public/ to the gh-pages branch with the workflow's own token
      # (no deploy key). GitHub Pages serves geomedialab.org from that branch
      # once Settings → Pages source is set to gh-pages.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
