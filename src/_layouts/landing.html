---
layout: base.html
bodyClass: landing
---
{% include 'tile-gallery.html' %}
<div class="landing-columns">
	<section class="landing-about prose">
		{{ content | safe }}
	</section>
	<aside class="landing-news" aria-labelledby="news-heading">
		<h2 id="news-heading">{{ i18n.news[lang] }}</h2>
		{% set postLimit = 4 %}
		{% set postWordLimit = 80 %}
		{% set newsUrl = collections.all | layoutUrl('posts-overview.html', lang) %}
		{% include 'posts.html' %}
	</aside>
</div>
