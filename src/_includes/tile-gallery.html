{# Horizontal project strip: a plain overflow-x scroller, as on the original site. #}
<div class="tile-gallery" role="region" aria-label="{{ i18n.projects[lang] }}">
{% for p in collections.gallery | forLang(lang) %}
    <a class="project-card" href="{{ p.data.redirect or p.url }}">
        <span class="project-card-img">
            {% if p.data.img %}<img src="{{ p.data.img | replace(' ', '%20') }}" alt="" loading="lazy" style="object-position: {{ p.data.focus or '50% 50%' }}">{% endif %}
        </span>
        <span class="project-card-title">{{ p.data.title }}</span>
        {% if p.data.years %}<span class="project-card-years">{{ p.data.years }}</span>{% endif %}
    </a>
{% endfor %}
</div>
