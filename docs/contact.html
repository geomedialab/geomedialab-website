	<div class="container">
	    
	    <div class="spacer"></div>
	    
	    <div class="row text-center">
		
			<div id="mapid"></div>
				        
	        <!-- map functionality -->
	        <script>
				//initialize map
				var mymap = L.map('mapid', { zoomControl: false, scrollWheelZoom: false }).setView([45.50, -73.575], 14);
				
				//function take from http://gis.stackexchange.com/questions/111887/leaflet-mouse-wheel-zoom-only-after-click-on-map/210712#210712
				mymap.once('focus', function() { mymap.scrollWheelZoom.enable(); });
				
				//basemap tile layer load
				L.tileLayer('http://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
				    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="http://cartodb.com/attributions">CartoDB</a>',
				    maxZoom: 17,
					minZoom: 10,
				}).addTo(mymap);
				//add marker with contact info
				var marker = L.marker([45.497315, -73.578822]).addTo(mymap);
				marker.bindPopup("<p><span class='glyphicon glyphicon-phone-alt'></span>&nbsp;&nbsp;&nbsp;(514) 848-2424 ext. 2052<br/><span class='glyphicon glyphicon-envelope'></span>&nbsp;&nbsp;&nbsp;sebastien.caquard@concordia.ca</br></br>H-1260, Henry F. Hall Building<br/>1455 de Maisonneuve West<br/>Montreal, QC H3G-1M8 Canada</p>").openPopup();
			</script>
